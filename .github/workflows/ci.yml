# Reusable quality gate. Called by pull-request.yml (PRs) and deploy.yml (main).
# No Docker anywhere: Python/Node via setup-* actions, PostgreSQL via native apt packages.
# No secrets: everything runs against throwaway local services.
name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backend:
    name: Backend (Ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check --output-format=github .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Pytest (in-memory SQLite)
        run: python -m pytest -q -p no:cacheprovider
        env:
          APP_ENV: test

  migrations:
    name: Migrations (PostgreSQL 17 + PostGIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install PostgreSQL 17 + PostGIS (native packages, matches Supabase's major version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-17 postgresql-17-postgis-3
          sudo pg_ctlcluster 17 main start
          # The runner image may already own port 5432 with another version: use cluster 17's port.
          echo "PGPORT_17=$(pg_lsclusters -h | awk '$1 == "17" {print $3}')" >> "$GITHUB_ENV"
      - name: Create a disposable test database shaped like Supabase
        run: |
          sudo -u postgres psql -p "$PGPORT_17" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ci LOGIN PASSWORD 'ci-only-not-a-secret';
          CREATE DATABASE agrisense_test OWNER ci;
          -- Supabase's Data API roles, with Supabase's default grants on new public tables,
          -- so the RLS guard test proves our migrations revoke them.
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          \connect agrisense_test
          CREATE SCHEMA extensions;
          CREATE EXTENSION postgis WITH SCHEMA extensions;
          GRANT USAGE ON SCHEMA public TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE ci IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;
          SQL
      - name: Validate migrations and run the suite on PostgreSQL
        run: scripts/validate_migrations.sh "postgresql://ci:ci-only-not-a-secret@127.0.0.1:${PGPORT_17}/agrisense_test"

  frontend:
    name: Frontend (ESLint, types, Vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: Browser tests (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Backend virtualenv (used by e2e/start-backend.sh)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium (native OS packages via apt, no Docker)
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Python packages (pip-audit, known vulnerabilities)
        run: |
          python -m pip install -q pip-audit
          pip-audit -r backend/requirements.txt
      - name: npm packages shipped to browsers (high and critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
