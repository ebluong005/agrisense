# Manual rollback of application code. Never touches the database: schema changes are
# rolled forward with a new migration (see docs/CICD_DESIGN.md). Production requires approval.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [production, staging]
        default: production
      backend:
        description: Roll back the Render backend
        type: boolean
        default: true
      render_deploy_id:
        description: Render deploy id to restore (blank = the previous successful deploy)
        type: string
        required: false
      frontend:
        description: Roll back the Vercel frontend (production only)
        type: boolean
        default: true
      vercel_deployment:
        description: Vercel deployment URL or id to restore (blank = the previous production deployment)
        type: string
        required: false

concurrency:
  group: deploy-main # never overlap with a release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Backend (Render rollback API)
        if: inputs.backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ inputs.render_deploy_id }}
        run: |
          args=(rollback --service "${{ vars.RENDER_SERVICE_ID }}")
          [ -n "$DEPLOY_ID" ] && args+=(--deploy "$DEPLOY_ID")
          python3 scripts/render_deploy.py "${args[@]}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.frontend && inputs.environment == 'production'
        with:
          node-version-file: frontend/.nvmrc
      - name: Frontend (vercel rollback)
        if: inputs.frontend && inputs.environment == 'production'
        env:
          TARGET: ${{ inputs.vercel_deployment }}
        run: npx --yes vercel@66.6.0 rollback $TARGET --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test (read-only)
        run: python3 scripts/smoke_test.py --api "${{ vars.API_URL }}" ${{ inputs.environment == 'production' && format('--web "{0}"', vars.WEB_URL) || '' }}
