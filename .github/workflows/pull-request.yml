# Every pull request to main: full CI, then (same-repo PRs only) a Vercel preview + smoke test.
# Branch protection on main should require the "ci / ..." checks from this workflow.
name: Pull request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  preview:
    name: Vercel preview
    needs: ci
    # Pull requests from forks never receive secrets (GitHub also withholds them).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write # comment the preview URL
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@66.6.0
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Build and deploy preview (preview env vars point at the staging API)
        id: deploy
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          npx --yes "$VERCEL_CLI" build --token="${{ secrets.VERCEL_TOKEN }}"
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" | python3 ../scripts/vercel_url.py)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test (read-only)
        working-directory: .
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python3 scripts/smoke_test.py --api "${{ vars.API_URL }}" --web "${{ steps.deploy.outputs.url }}"
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BODY: "Preview for ${{ github.event.pull_request.head.sha }}: ${{ steps.deploy.outputs.url }} (uses the staging API)"
        run: gh pr comment "$PR" --edit-last --create-if-none --body "$BODY"
